<!DOCTYPE html>
<!--
  LiveAsk RA Activation Surface (Guided Tours MVP Package A, 12 September
  2026, spec Section E: "Use a LiveAsk-owned surface, conceptually
  https://liveask.au/activate?t=<opaque-token>").

  Genuinely new — no existing seam in runtime.js or index.js owns "an RA
  privately chooses and confirms a PIN in a browser". This is deliberately
  NOT part of the conversational widget: it's a separate, standalone
  surface, matching the spec's own framing that activation is not a Tour
  or chat interaction.

  Talks to the SAME backend Worker via the SAME body-shape-dispatch
  convention every other distinct request shape in index.js already uses
  (activationResolve / activationSubmit) — no new HTTP route was invented
  for this beyond the two already added to index.js's fetch() dispatch.

  CW must host this file and supply the correct Worker URL for the
  deployment it serves — see CW_INTEGRATION_MANIFEST.md.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveAsk — Activate your account</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #FAFAF7; color: #1D2A3A; margin: 0; padding: 0; }
  .wrap { max-width: 420px; margin: 60px auto; padding: 32px; background: #fff; border: 1px solid #DCE0E4; border-radius: 10px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: #4A5A6E; font-size: 14px; margin: 0 0 24px; }
  input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; border: 1px solid #DCE0E4; border-radius: 6px; margin-bottom: 12px; }
  button { width: 100%; padding: 12px 14px; font-size: 15px; font-weight: 600; border: none; border-radius: 6px; background: #0E1B2C; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { color: #7a1f1f; background: #fff3f3; border: 1px solid #e0b4b4; border-radius: 6px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  .hint { font-size: 13px; color: #4A5A6E; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <p>Loading…</p>
</div>
<script>
(function () {
  'use strict';

  // Deployment-specific — set this to the real Worker URL for whichever
  // tenant this activation page is served for. Not read from the page's
  // own query string or any other untrusted source; the ACTUAL
  // tenant/role/email this activation is for is resolved entirely
  // server-side from the token, never trusted from this file's own
  // configuration or the browser's URL.
  var WORKER_URL = 'https://ask-liveask.chriscarroll-promptworkx.workers.dev';

  var params = new URLSearchParams(window.location.search);
  var token = params.get('t') || '';
  var app = document.getElementById('app');

  function render(html) { app.innerHTML = html; }

  function renderError(message) {
    render('<h1>Unable to activate</h1><div class="error">' + escapeHtml(message) + '</div><p class="hint">If you believe this is a mistake, contact whoever sent you this link for a new one.</p>');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function post(body) {
    return fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) { return res.json(); });
  }

  if (!WORKER_URL) {
    renderError('This activation page is not correctly configured (no Worker URL set). Contact the site administrator.');
    return;
  }
  if (!token) {
    renderError('This activation link is missing its token.');
    return;
  }

  var REASON_MESSAGES = {
    not_found: 'This activation link is not recognised.',
    expired: 'This activation link has expired.',
    consumed: 'This activation link has already been used.',
    revoked: 'This activation link has been revoked.',
    invalid_token: 'This activation link is invalid.'
  };

  post({ activationResolve: { token: token } }).then(function (result) {
    if (!result.ok) {
      renderError(REASON_MESSAGES[result.reason] || 'This activation link is not valid.');
      return;
    }
    renderPinForm(result);
  }).catch(function () {
    renderError('Something went wrong loading this page. Please try again in a moment.');
  });

  function renderPinForm(resolved) {
    render(
      '<h1>Activate your LiveAsk account</h1>' +
      '<p class="sub">Choose a PIN you\'ll use to sign in. Nobody else — including LiveAsk staff — will ever see it.</p>' +
      '<input type="password" inputmode="numeric" id="pin" placeholder="Choose a PIN" autocomplete="new-password">' +
      '<input type="password" inputmode="numeric" id="pinConfirm" placeholder="Confirm PIN" autocomplete="new-password">' +
      '<div id="formError"></div>' +
      '<button id="submitBtn">Activate</button>'
    );
    document.getElementById('submitBtn').addEventListener('click', function () {
      var pin = document.getElementById('pin').value;
      var pinConfirm = document.getElementById('pinConfirm').value;
      var errEl = document.getElementById('formError');
      errEl.innerHTML = '';
      if (!pin || pin.length < 4) {
        errEl.innerHTML = '<div class="error">Choose a PIN of at least 4 digits.</div>';
        return;
      }
      if (pin !== pinConfirm) {
        errEl.innerHTML = '<div class="error">PINs do not match.</div>';
        return;
      }
      document.getElementById('submitBtn').disabled = true;
      post({ activationSubmit: { token: token, pin: pin, pinConfirm: pinConfirm } }).then(function (result) {
        if (!result.ok) {
          document.getElementById('submitBtn').disabled = false;
          errEl.innerHTML = '<div class="error">' + escapeHtml(REASON_MESSAGES[result.reason] || 'That did not work — please try again.') + '</div>';
          return;
        }
        render('<h1>You\'re all set</h1><p class="sub">Your account is active. You can now sign in with your email and the PIN you just chose.</p>');
      }).catch(function () {
        document.getElementById('submitBtn').disabled = false;
        errEl.innerHTML = '<div class="error">Something went wrong. Please try again.</div>';
      });
    });
  }
})();
</script>
</body>
</html>
